    default: true
    workspace:
      host: https://dbc-3af6968e-b75d.cloud.databricks.com
    variables:
      catalog: edw_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-3af6968e-b75d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/awaisajaz1@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/awaisajaz1@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: edw_prod
      schema: prod
    permissions:
      - user_name: awaisajaz1@gmail.com
        level: CAN_MANAGE
